# Licenses third-party crates may use. `cargo about generate` (run when
# packaging a release) fails if a dependency uses anything else, so a new
# dependency with an incompatible license can't slip in unnoticed.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "NCSA",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
    "LGPL-2.1-or-later",
    "GPL-3.0-or-later",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
