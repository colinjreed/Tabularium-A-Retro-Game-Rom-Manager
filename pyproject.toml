[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rom-manager"
version = "0.1.0"
description = "Organise retro game ROMs, remove duplicates, scrape artwork and export SD card collections for handhelds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=9"]
test = ["pytest>=7"]

[project.scripts]
rom-manager = "rom_manager.cli:main"

[tool.setuptools.packages.find]
include = ["rom_manager*"]
