name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Built on an older Ubuntu so the binary runs on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked
      - name: Test
        run: cargo test --all --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package (tar.gz + AppImage)
        run: |
          mkdir -p dist/tabularium
          cp target/release/tabularium dist/tabularium/
          cp packaging/linux/tabularium.desktop packaging/linux/install.sh dist/tabularium/
          cp assets/icon-256.png dist/tabularium/tabularium.png
          tar -C dist -czf tabularium-linux-x86_64.tar.gz tabularium

          mkdir -p AppDir/usr/bin
          cp target/release/tabularium AppDir/usr/bin/
          cp packaging/linux/tabularium.desktop AppDir/
          cp assets/icon-256.png AppDir/tabularium.png
          ln -s usr/bin/tabularium AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir Tabularium-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: tabularium-linux
          path: |
            tabularium-linux-x86_64.tar.gz
            Tabularium-x86_64.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --all --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Tabularium | Out-Null
          Copy-Item target/release/tabularium.exe "dist/Tabularium/Tabularium.exe"
          Compress-Archive -Path dist/Tabularium -DestinationPath tabularium-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tabularium-windows
          path: tabularium-windows-x86_64.zip

  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --all --locked
      - name: Build (Apple Silicon + Intel)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package (.app in a .dmg)
        run: |
          APP="dist/Tabularium.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/tabularium" \
            target/aarch64-apple-darwin/release/tabularium \
            target/x86_64-apple-darwin/release/tabularium
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          sed "s/VERSION/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          # Ad-hoc signature (required for Apple Silicon); not notarised.
          codesign --force --deep --sign - "$APP"
          ln -s /Applications dist/Applications
          hdiutil create -volname "Tabularium" -srcfolder dist -ov -format UDZO tabularium-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: tabularium-macos
          path: tabularium-macos-universal.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
