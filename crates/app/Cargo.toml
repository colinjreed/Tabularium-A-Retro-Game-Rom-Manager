[package]
name = "tabularium"
version.workspace = true
edition.workspace = true

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37.0", features = ["image", "file"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
open = "5.4.5"
rfd = "0.18.0"
tabularium-core = { version = "0.2.1", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
winresource = "0.1.34"
