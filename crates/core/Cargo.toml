[package]
name = "tabularium-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "ROM library, cleaning, scraping, BIOS and SD card export logic"

[dependencies]
crc32fast = "1.5.5"
dunce = "1.0.5"
fs4 = "1.1.0"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp"] }
md-5 = "0.10.6"
percent-encoding = "2.3.2"
rayon = "1.12.0"
regex = "1.13.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strsim = "0.11.1"
thiserror = "2.0.21"
ureq = { version = "3.5", features = ["platform-verifier"] }
walkdir = "2.5.1"
xmltree = "0.12.0"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
crc32fast = "1.5.5"
image = "0.25.6"
md-5 = "0.10.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
